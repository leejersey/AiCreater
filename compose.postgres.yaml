services:
  postgres:
    image: postgres:16.13@sha256:5a65324fe84dc41709ff914e90b07f3e2f577073ed27bf917d4873aca0c9ec51
    environment:
      POSTGRES_DB: aicreater
      POSTGRES_USER: aicreater
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    # Back after a reboot or Docker restart; `docker compose stop` still stops it.
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - project_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aicreater -d aicreater"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  project_data:
